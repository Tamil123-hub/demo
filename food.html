    <script>
        // Load html2canvas library dynamically so you don't need to touch the HTML
if (!document.getElementById("html2canvas-script")) {
    const script = document.createElement("script");
    script.id = "html2canvas-script";
    script.src = "https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js";
    document.head.appendChild(script);
}

document.addEventListener("DOMContentLoaded", () => {
    // 1. Target all food card containers across dishes and drinks
    const itemCards = document.querySelectorAll(".pre > div, .dri > div");

    itemCards.forEach((card) => {
        const input = card.querySelector("input[type='number']");
        const buttons = card.querySelectorAll("button");
        
        // Ensure initial input value defaults to 0
        if (input) {
            input.value = 0;
            input.min = 0; // Prevent manually typing negative numbers
        }

        // Identify + and - buttons based on text content
        buttons.forEach((btn) => {
            btn.addEventListener("click", () => {
                let currentVal = parseInt(input.value) || 0;

                if (btn.innerText.includes("+")) {
                    input.value = currentVal + 1;
                } else if (btn.innerText.includes("-")) {
                    if (currentVal > 0) {
                        input.value = currentVal - 1;
                    }
                }
            });
        });
    });

    // Create or select bill container
    let billContainer = document.getElementById("bill-receipt-container");
    if (!billContainer) {
        billContainer = document.createElement("div");
        billContainer.id = "bill-receipt-container";
        billContainer.style.cssText = `
            display: none;
            max-width: 400px;
            margin: 20px auto;
            padding: 20px;
            background-image:url(ord1.png);
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            text-align: center;
            font-family: Arial, sans-serif;
            color: #333;
        `;
        document.body.appendChild(billContainer);
    }

    // 2. Order Confirmation Logic
    const confirmBtn = document.querySelector(".order .button");

    confirmBtn.addEventListener("click", () => {
        let totalBill = 0;
        let selectedItems = [];

        itemCards.forEach((card) => {
            const title = card.querySelector("h3")?.innerText.trim();
            const priceText = card.querySelector("h4")?.innerText.trim();
            const quantity = parseInt(card.querySelector("input[type='number']")?.value) || 0;

            if (quantity > 0 && priceText && title) {
                // Extract digits from price string (e.g., "₹150" -> 150)
                const price = parseInt(priceText.replace(/[^\d]/g, "")) || 0;
                const itemTotal = price * quantity;

                totalBill += itemTotal;
                selectedItems.push({ title, quantity, price, itemTotal });
            }
        });

        // Validation for empty cart
        if (selectedItems.length === 0) {
            alert("Your cart is empty! Please select at least one item.");
            billContainer.style.display = "none";
            return;
        }

        // 3. Construct Bill Table HTML
        let tableRows = selectedItems.map(item => `
            <tr style="border-bottom: 1px solid #ddd;">
                <td style="padding: 8px; text-align: left;">${item.title}</td>
                <td style="padding: 8px; text-align: center;">${item.quantity}</td>
                <td style="padding: 8px; text-align: center;">₹${item.price}</td>
                <td style="padding: 8px; text-align: right;">₹${item.itemTotal}</td>
            </tr>
        `).join("");

        billContainer.innerHTML = `
            <h2 style="margin: 0 0 5px 0; color: chocolate;">Straw Hat Foods</h2>
            <p style="font-size: 12px; color: #666; margin-bottom: 15px;">Order Receipt</p>
            <table style="width: 100%; border-collapse: collapse; font-size: 14px;">
                <thead>
                    <tr style="background-color: #f2f2f2;">
                        <th style="padding: 8px; text-align: left;">Item</th>
                        <th style="padding: 8px; text-align: center;">Qty</th>
                        <th style="padding: 8px; text-align: center;">Price</th>
                        <th style="padding: 8px; text-align: right;">Total</th>
                    </tr>
                </thead>
                <tbody>
                    ${tableRows}
                </tbody>
            </table>
            <div style="margin-top: 15px; font-weight: bold; font-size: 16px; text-align: right;">
                <center><h2 style="background-color:green;">Grand Total: ₹${totalBill}</h2></center>
            </div>
            <button id="download-bill-btn" style="
                margin-top: 15px;
                padding: 10px 15px;
                background-color: #28a745;
                color: white;
                border: none;
                border-radius: 5px;
                font-weight: bold;
                cursor: pointer;
            ">Download Receipt Image</button>
        `;

        billContainer.style.display = "block";
        billContainer.scrollIntoView({ behavior: 'smooth' });

        // 4. Download Receipt as Image Logic
        document.getElementById("download-bill-btn").addEventListener("click", function() {
            const downloadBtn = this;
            downloadBtn.style.display = "none"; // Hide button before screenshot

            if (window.html2canvas) {
                html2canvas(billContainer).then(canvas => {
                    const link = document.createElement("a");
                    link.download = "StrawHatFoods_Receipt.png";
                    link.href = canvas.toDataURL("image/png");
                    link.click();
                    downloadBtn.style.display = "inline-block"; // Restore button
                });
            } else {
                alert("Receipt image generation library is loading. Please try again in a moment.");
                downloadBtn.style.display = "inline-block";
            }
        });
    });
});
    </script>
