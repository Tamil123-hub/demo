<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Restaurant Billing System</title>

<style>
body{
    font-family:Arial,sans-serif;
    background:#f4f4f4;
    margin:20px;
}

.container{
    width:90%;
    margin:auto;
    background:white;
    padding:20px;
    border-radius:10px;
    box-shadow:0 0 10px gray;
}

h1{
    text-align:center;
    color:darkred;
}

fieldset{
    margin-top:20px;
    padding:15px;
}

legend{
    font-size:20px;
    font-weight:bold;
}

.menu{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
}

.item{
    width:180px;
    text-align:center;
    margin:15px;
}

.item img{
    width:120px;
    height:100px;
    border-radius:10px;
    border:2px solid black;
}

select,button{
    padding:10px;
    margin:10px;
}

textarea{
    width:100%;
    font-size:16px;
}
</style>

</head>

<body>

<div class="container">

<h1>Restaurant Billing System</h1>

<form>

<fieldset>

<legend>Food Items</legend>

<div class="menu">

<div class="item">
<img src="images/biryani.jpg" alt="Biryani">
<br><br>
<input type="checkbox" id="biryani" value="200">
<label>Biryani ₹200</label>
</div>

<div class="item">
<img src="images/pizza.jpg" alt="Pizza">
<br><br>
<input type="checkbox" id="pizza" value="180">
<label>Pizza ₹180</label>
</div>

<div class="item">
<img src="images/thali.jpg" alt="Thali">
<br><br>
<input type="checkbox" id="thali" value="120">
<label>Thali ₹120</label>
</div>

<div class="item">
<img src="images/fries.jpg" alt="Fries">
<br><br>
<input type="checkbox" id="fries" value="70">
<label>Fries ₹70</label>
</div>

<div class="item">
<img src="images/salad.jpg" alt="Salad">
<br><br>
<input type="checkbox" id="salad" value="60">
<label>Salad ₹60</label>
</div>

<div class="item">
<img src="images/wings.jpg" alt="Chicken Wings">
<br><br>
<input type="checkbox" id="wings" value="90">
<label>Chicken Wings ₹90</label>
</div>

</div>

</fieldset>

<fieldset>

<legend>Drinks</legend>

<select id="drink">
<option value="0">Select Drink</option>
<option value="40">Coke ₹40</option>
<option value="40">Pepsi ₹40</option>
<option value="50">Juice ₹50</option>
<option value="20">Water ₹20</option>
</select>

</fieldset>

<center>

<button type="button" onclick="calculateTotal()">
Calculate Total
</button>

<button type="reset" onclick="clearAll()">
Clear All
</button>

</center>

<br>

<textarea id="output" rows="12" readonly></textarea>

</form>

</div>

<script>

function calculateTotal(){

let total=0;
let bill="******** Restaurant Bill ********\n\n";

let items=[
["Biryani",200,"biryani"],
["Pizza",180,"pizza"],
["Thali",120,"thali"],
["Fries",70,"fries"],
["Salad",60,"salad"],
["Chicken Wings",90,"wings"]
];

for(let i=0;i<items.length;i++){

if(document.getElementById(items[i][2]).checked){

bill+=items[i][0]+" - ₹"+items[i][1]+"\n";

total+=items[i][1];

}

}

let drink=document.getElementById("drink");

if(drink.value!="0"){

bill+="Drink - ₹"+drink.value+"\n";

total+=parseInt(drink.value);

}

bill+="\n--------------------------\n";
bill+="Total = ₹"+total;

document.getElementById("output").value=bill;

}

function clearAll(){

document.getElementById("output").value="";

}

</script>

</body>
</html>
